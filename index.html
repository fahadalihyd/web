<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Fahad Ali is an AI Solutions Engineer focused on forward-deployed engineering, AI agents, RAG, and full-stack systems with Laravel, Node.js, and React."
    />
    <meta name="theme-color" content="#0a0f1c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fahad Ali | AI Solutions Engineer" />
    <meta
      property="og:description"
      content="8+ years building scalable web, SaaS, and AI solutions — from architecture through production — with Laravel, Node.js, React, and agentic systems."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f7fb' : '#0a0f1c')
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
